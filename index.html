<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Balaji Wash Sand - ERP</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1e40af" />
    <meta name="description" content="Balaji Wash Sand - Enterprise Resource Planning System" />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0f172a; }
      #root { width: 100%; height: 100%; }
      /* Initial loader - shows before React loads */
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #app-loader.hidden {
        opacity: 0;
        visibility: hidden;
      }
      #app-loader .loader-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 2rem;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: 0.1em;
        margin-bottom: 1.5rem;
      }
      #app-loader .loader-spinner {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 3px solid #334155;
        border-top-color: #3b82f6;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Initial loader shown before React hydrates -->
    <div id="app-loader">
      <div class="loader-text">BWS</div>
      <div class="loader-spinner"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Hide the loader once React app is ready
      window.addEventListener('DOMContentLoaded', function() {
        // Give React a moment to render
        setTimeout(function() {
          var loader = document.getElementById('app-loader');
          if (loader) loader.classList.add('hidden');
        }, 100);
      });
    </script>
  </body>
</html>
